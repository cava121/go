<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        padding: 1.5rem;
      }

      .card {
        width: 100%;
        max-width: 480px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 2.5rem 2rem;
        box-shadow:
          0 25px 50px -12px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
        flex-shrink: 0;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #f1f5f9;
        letter-spacing: -0.02em;
      }

      h2 {
        font-size: 0.8125rem;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 1rem;
      }

      .divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.06);
        margin: 1.5rem 0;
      }

      .section-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .section-header h2 {
        margin-bottom: 0;
      }

      .section-header .line {
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.06);
      }

      .output {
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 14px;
        padding: 1.25rem;
        min-height: 80px;
        font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
        font-size: 0.875rem;
        line-height: 1.6;
        color: #94a3b8;
        white-space: pre-wrap;
        word-break: break-word;
        margin-bottom: 1.5rem;
        transition:
          color 0.3s,
          border-color 0.3s;
      }

      .output:not(:empty) {
        color: #e2e8f0;
        border-color: rgba(255, 255, 255, 0.1);
      }

      .output.loading {
        color: #64748b;
        font-style: italic;
      }

      .output.error {
        color: #f87171;
        border-color: rgba(248, 113, 113, 0.25);
      }

      .output.success {
        border-color: rgba(34, 197, 94, 0.2);
      }

      button {
        width: 100%;
        padding: 0.875rem;
        font-family: inherit;
        font-size: 0.9375rem;
        font-weight: 500;
        color: #fff;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.2s,
          background 0.2s;
        box-shadow:
          0 4px 14px rgba(59, 130, 246, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        letter-spacing: -0.01em;
        position: relative;
        overflow: hidden;
      }

      button::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 50%
        );
        pointer-events: none;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow:
          0 6px 20px rgba(59, 130, 246, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
        background: linear-gradient(135deg, #3f8afc, #2b6ef0);
      }

      button:active {
        transform: translateY(0);
        box-shadow:
          0 2px 8px rgba(59, 130, 246, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }

      .arrow {
        transition: transform 0.2s;
        font-size: 1.1em;
        line-height: 1;
      }

      button:hover .arrow {
        transform: translateX(3px);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .output .spinner {
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 0;
      }

      .output.loading .spinner {
        display: flex;
      }

      .output.loading .spinner svg {
        animation: spin 0.7s linear infinite;
      }

      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        font-size: 0.75rem;
        color: #64748b;
        margin-top: 1.25rem;
        text-align: center;
      }

      .badge a {
        color: #60a5fa;
        text-decoration: none;
      }

      .badge a:hover {
        text-decoration: underline;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      .input-group {
        display: flex;
        gap: 0.75rem;
      }

      .input-group input {
        flex: 1;
        padding: 0.75rem 1rem;
        font-family: inherit;
        font-size: 0.9375rem;
        color: #f1f5f9;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .input-group input::placeholder {
        color: #475569;
      }

      .input-group input:focus {
        border-color: rgba(59, 130, 246, 0.5);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      .input-group button {
        width: auto;
        padding: 0.75rem 1.25rem;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .create-result {
        margin-top: 0.75rem;
        padding: 0.75rem 1rem;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        font-size: 0.8125rem;
        color: #94a3b8;
        white-space: pre-wrap;
        word-break: break-word;
        transition:
          color 0.3s,
          border-color 0.3s;
        min-height: 0;
        display: none;
      }

      .create-result.show {
        display: block;
      }

      .create-result.error {
        color: #f87171;
        border-color: rgba(248, 113, 113, 0.25);
      }

      .create-result.success {
        color: #4ade80;
        border-color: rgba(34, 197, 94, 0.2);
      }

      .create-result.loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        color: #64748b;
      }

      .create-result.loading svg {
        animation: spin 0.7s linear infinite;
      }

      .lists {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .list-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
        text-decoration: none;
        color: inherit;
      }

      .list-item:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.1);
      }

      .list-item-name {
        font-size: 0.9375rem;
        font-weight: 500;
        color: #e2e8f0;
      }

      .list-item-id {
        font-size: 0.75rem;
        color: #475569;
        font-family: "SF Mono", "Fira Code", monospace;
      }

      .list-item-arrow {
        color: #475569;
        transition:
          color 0.15s,
          transform 0.15s;
        font-size: 1rem;
      }

      .list-item:hover .list-item-arrow {
        color: #60a5fa;
        transform: translateX(2px);
      }

      .lists-empty {
        text-align: center;
        padding: 1.5rem 0;
        color: #475569;
        font-size: 0.875rem;
      }

      .loading-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.5rem 0;
        color: #64748b;
        font-size: 0.875rem;
      }

      .loading-spinner svg {
        animation: spin 0.7s linear infinite;
      }

      .lists-error {
        text-align: center;
        padding: 1rem 0;
        color: #f87171;
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <span class="dot"></span>
        <h1>Todo App</h1>
      </div>

      <div class="section-header">
        <h2>Debug</h2>
        <span class="line"></span>
      </div>

      <div class="output" id="output">
        <span class="spinner">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <path d="M12 2a10 10 0 0 1 10 10" opacity="0.3" />
            <path d="M12 2a10 10 0 0 1 10 10" />
          </svg>
        </span>
      </div>

      <button id="fetchBtn" type="button">
        Get Last Commit
        <span class="arrow">→</span>
      </button>

      <div class="divider"></div>

      <div class="section-header">
        <h2>All Lists</h2>
        <span class="line"></span>
      </div>

      <div id="listsContainer">
        <div class="loading-spinner" id="listsLoading">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <path d="M12 2a10 10 0 0 1 10 10" opacity="0.3" />
            <path d="M12 2a10 10 0 0 1 10 10" />
          </svg>
          Loading...
        </div>
      </div>

      <div class="divider"></div>

      <div class="section-header">
        <h2>Create List</h2>
        <span class="line"></span>
      </div>

      <div class="input-group">
        <input id="listNameInput" type="text" placeholder="List name..." />
        <button id="createBtn" type="button">Create</button>
      </div>

      <div class="create-result" id="createResult"></div>
    </div>

    <script>
      const btn = document.getElementById("fetchBtn");
      const output = document.getElementById("output");

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        output.className = "output loading";

        try {
          const res = await fetch("http://localhost:8090/debug/info");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          output.className = "output success";
          output.textContent = text;
        } catch (err) {
          output.className = "output error";
          output.textContent = "Error: " + err.message;
        } finally {
          btn.disabled = false;
        }
      });

      const listsContainer = document.getElementById("listsContainer");

      fetch("http://localhost:8090/v1/lists")
        .then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then((data) => {
          const lists = Array.isArray(data) ? data : data.lists || [];
          console.log(lists);

          if (lists.length === 0) {
            listsContainer.innerHTML =
              '<div class="lists-empty">No lists yet</div>';
            return;
          }
          listsContainer.innerHTML =
            '<div class="lists">' +
            lists
              .map(
                (l) => `
                <a class="list-item" href="list.html?id=${l.Id}">
                  <div>
                    <div class="list-item-name">${l.Name}</div>
                    <div class="list-item-id">${l.Id}…</div>
                  </div>
                  <span class="list-item-arrow">→</span>
                </a>
              `,
              )
              .join("") +
            "</div>";
        })
        .catch((err) => {
          listsContainer.innerHTML =
            '<div class="lists-error">Failed to load: ' +
            err.message +
            "</div>";
        });

      const createBtn = document.getElementById("createBtn");
      const listNameInput = document.getElementById("listNameInput");
      const createResult = document.getElementById("createResult");

      createBtn.addEventListener("click", async () => {
        const name = listNameInput.value.trim();
        if (!name) {
          createResult.className = "create-result show error";
          createResult.textContent = "Name is required";
          return;
        }

        createBtn.disabled = true;
        createResult.className = "create-result show loading";
        createResult.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 2a10 10 0 0 1 10 10" opacity="0.3"/>
            <path d="M12 2a10 10 0 0 1 10 10"/>
          </svg>
          Creating...
        `;

        try {
          const res = await fetch("http://localhost:8090/v1/lists", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          window.location.href = `list.html?id=${data.list.id}`;
        } catch (err) {
          createResult.className = "create-result show error";
          createResult.textContent = "Error: " + err.message;
        } finally {
          createBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
